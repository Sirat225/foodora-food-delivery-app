<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed! | Foodora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --foodora-primary: #6f42c1; /* Purple */
            --foodora-dark-purple: #4a287c;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .foodora-btn-primary {
            background-color: var(--foodora-primary);
            border-color: var(--foodora-primary);
            color: white;
        }
        .foodora-btn-primary:hover {
            background-color: #5a359e;
            border-color: #5a359e;
        }
        .success-icon {
            font-size: 4rem;
            color: #28a745; /* Green color for success */
        }
    </style>
</head>
<body>

    <header class="p-3 sticky-top" style="background-color: white; border-bottom: 1px solid #eee;">
        <div class="container">
            <span class="foodora-logo d-flex align-items-center justify-content-center">
                <img src="images/foodora-icon.jpg" alt="Foodora Icon" style="height: 30px; margin-right: 5px; object-fit: contain;">
                <span style="color: var(--foodora-primary); font-weight: 800; font-size: 1.5rem;">Foodora</span>
            </span>
        </div>
    </header>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-5 text-center shadow-lg">
                    <i class="fas fa-check-circle success-icon mb-4"></i>
                    
                    <h1 class="mb-3" style="color: #28a745; font-weight: 800;">Order Confirmed!</h1>
                    
                    <p class="lead text-muted">Your order <span id="order-number">**#FDR-10923**</span> has been successfully placed.</p>
                    <p class="mb-4">We've sent the details to <span id="restaurant-name">**Pizza Fusion**</span>. You can track your rider's location soon!</p>
                    
                    <hr class="w-75 mx-auto">
                    
                    <h4 class="mt-4 mb-3" style="color: var(--foodora-primary);">Estimated Delivery Time</h4>
                    <h2 id="delivery-time" style="font-weight: 800;">30 - 40 Minutes</h2>

                    <div class="d-grid gap-2 mt-4">
                        <a href="#" class="btn foodora-btn-primary py-2">
                            <i class="fas fa-map-marker-alt me-2"></i> Track Your Order Live
                        </a>
                        <a href="restaurants.html" class="btn btn-outline-secondary">
                            Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load order details from localStorage
        document.addEventListener('DOMContentLoaded', () => {
            const lastOrder = localStorage.getItem('lastOrder');
            const checkoutRestaurant = localStorage.getItem('checkoutRestaurant');
            
            if (lastOrder) {
                const order = JSON.parse(lastOrder);
                document.getElementById('order-number').textContent = `**${order.orderNumber}**`;
                
                if (order.restaurant && order.restaurant.name) {
                    document.getElementById('restaurant-name').textContent = `**${order.restaurant.name}**`;
                }
                
                if (order.estimatedDeliveryTime) {
                    const deliveryTime = new Date(order.estimatedDeliveryTime);
                    const now = new Date();
                    const diffMinutes = Math.ceil((deliveryTime - now) / (1000 * 60));
                    document.getElementById('delivery-time').textContent = `${diffMinutes} Minutes`;
                }
            } else if (checkoutRestaurant) {
                const restaurant = JSON.parse(checkoutRestaurant);
                document.getElementById('restaurant-name').textContent = `**${restaurant.name}**`;
                document.getElementById('delivery-time').textContent = restaurant.time || '30 - 40 Minutes';
            }
        });
    </script>
</body>
</html>
