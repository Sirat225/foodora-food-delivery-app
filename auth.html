<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodora - Login / Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    <style>
        /* Foodora Primary Color Variable for links and buttons */
        :root {
            --foodora-primary: #a020f0; /* Purple/Pink */
        }
        .foodora-logo {
            color: var(--foodora-primary);
            font-weight: 800;
        }
        .foodora-btn-primary {
            background-color: var(--foodora-primary);
            border-color: var(--foodora-primary);
            color: white;
        }
        .foodora-btn-primary:hover {
            background-color: #8a2be2;
            border-color: #8a2be2;
            color: white;
        }
        .nav-tabs .nav-link.active {
            color: var(--foodora-primary) !important;
            border-bottom: 2px solid var(--foodora-primary) !important;
            border-top: none;
            border-left: none;
            border-right: none;
            font-weight: 600;
        }
        .alert-success-custom {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="text-center mb-4 foodora-logo">Foodora</h1>
                <div class="card p-4 foodora-card">
                    
                    <!-- Success Message Container -->
                    <div id="successMessage" class="alert-success-custom" style="display: none;">
                        <strong id="messageText"></strong>
                    </div>

                    <ul class="nav nav-tabs justify-content-center mb-4" id="myTab" role="tablist">
                        <li class="nav-item"><button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button></li>
                        <li class="nav-item"><button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button></li>
                    </ul>

                    <div class="tab-content" id="myTabContent">
                        
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form id="loginForm" novalidate>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                    <div class="invalid-feedback">Please enter a valid email.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                    <div class="invalid-feedback">Password cannot be empty.</div>
                                </div>
                                
                                <div class="mb-3 text-end">
                                    <a href="#" class="text-decoration-none" style="color: var(--foodora-primary);">Forgot Password?</a>
                                </div>
                                
                                <button type="submit" class="btn foodora-btn-primary w-100">Login</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="registrationForm" novalidate>
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="regEmail" required>
                                    <div class="invalid-feedback">Please enter a valid email (e.g., user@example.com).</div>
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="regPassword" required>
                                    <div class="invalid-feedback" id="passwordFeedback">Password must be at least 6 characters long.</div>
                                </div>
                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                    <div class="invalid-feedback" id="confirmPasswordFeedback">Passwords do not match.</div>
                                </div>
                                
                                <button type="submit" class="btn foodora-btn-primary w-100">Register</button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Backend API Configuration
        const API_BASE_URL = 'http://localhost:5000/api';

        // Show success message function
        function showSuccessMessage(message) {
            const successMessage = document.getElementById('successMessage');
            const messageText = document.getElementById('messageText');
            
            messageText.textContent = message;
            successMessage.style.display = 'block';
            
            // Hide message after 3 seconds
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        // Show error message function
        function showErrorMessage(message) {
            const successMessage = document.getElementById('successMessage');
            const messageText = document.getElementById('messageText');
            
            successMessage.className = 'alert alert-danger';
            messageText.textContent = message;
            successMessage.style.display = 'block';
            
            setTimeout(() => {
                successMessage.style.display = 'none';
                successMessage.className = 'alert-success-custom';
            }, 5000);
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            console.log('Login attempt:', { email, password: '***' });
            
            // Basic validation
            if (!email || !password) {
                showErrorMessage('Please fill in all fields');
                return;
            }

            try {
                console.log('Sending login request...');
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (response.ok) {
                    // Store token
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showSuccessMessage('Login successful! Redirecting...');
                    this.reset();
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'restaurants.html';
                    }, 2000);
                } else {
                    showErrorMessage(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showErrorMessage('Network error. Please try again.');
            }
        });

        // Registration form handler
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            console.log('Registration attempt:', { email, password: '***' });
            
            // Basic validation
            if (!email || !password || !confirmPassword) {
                showErrorMessage('Please fill in all fields');
                return;
            }
            
            if (password !== confirmPassword) {
                showErrorMessage('Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showErrorMessage('Password must be at least 6 characters');
                return;
            }

            try {
                console.log('Sending registration request...');
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: email.split('@')[0], // Use email prefix as name for now
                        email,
                        password,
                        phone: '+1234567890', // Default phone for now
                        role: 'customer'
                    })
                });

                const data = await response.json();
                console.log('Registration response:', data);

                if (response.ok) {
                    showSuccessMessage('Registration successful! You can now login.');
                    this.reset();
                    
                    // Switch to login tab after successful registration
                    const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
                    loginTab.show();
                } else {
                    showErrorMessage(data.message || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showErrorMessage('Network error. Please try again.');
            }
        });

        // Form validation
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                if (!this.checkValidity()) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                this.classList.add('was-validated');
            });
        });
    </script>
</body>
</html>
