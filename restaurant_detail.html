<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu | Foodora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --foodora-primary: #6f42c1;
            --foodora-dark-purple: #4a287c;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        
        .foodora-btn-primary {
            background-color: var(--foodora-primary) !important;
            border-color: var(--foodora-primary) !important;
            color: white;
        }
        
        .foodora-btn-primary:hover {
            background-color: #5a359e !important;
            border-color: #5a359e !important;
            color: white;
        }
        
        .restaurant-banner {
            height: 250px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            position: relative;
        }
        
        .restaurant-info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            padding: 20px;
            border-radius: 0 0 8px 8px;
        }
        
        .menu-category {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .menu-category:hover {
            background-color: var(--foodora-primary);
            color: white;
        }
        
        .menu-category.active {
            background-color: var(--foodora-primary);
            color: white;
        }
        
        .item-card {
            transition: transform 0.2s ease;
        }
        
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .cart-sidebar {
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white shadow-sm sticky-top">
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <a href="restaurants.html" class="btn btn-outline-secondary me-3">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                    <span class="foodora-logo d-flex align-items-center">
                        <img src="images/foodora-icon.jpg" alt="Foodora" style="height: 30px; margin-right: 5px;">
                        <span style="color: var(--foodora-primary); font-weight: 800; font-size: 1.5rem;">Foodora</span>
                    </span>
                </div>
                <div class="d-flex align-items-center">
                    <a href="auth.html" class="btn btn-outline-secondary me-2">Login</a>
                    <a href="auth.html" class="btn foodora-btn-primary">Sign up</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container my-4">
        <div class="row">
            <!-- Restaurant Info -->
            <div class="col-12 mb-4">
                <div id="restaurant-banner" class="restaurant-banner">
                    <div class="restaurant-info-overlay">
                        <h1 id="restaurant-name">Loading...</h1>
                        <p id="restaurant-cuisine" class="mb-1">Loading...</p>
                        <div class="d-flex align-items-center">
                            <span id="restaurant-rating" class="badge bg-warning text-dark me-2">0 <i class="fas fa-star"></i></span>
                            <span id="restaurant-delivery-info" class="text-light">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Menu Categories -->
            <div class="col-md-3 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Menu Categories</h5>
                    </div>
                    <div class="list-group list-group-flush" id="menu-categories">
                        <!-- Categories will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Menu Items -->
            <div class="col-md-6">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 id="menu-title">Menu Items</h3>
                </div>
                <div id="menu-items-container">
                    <!-- Menu items will be loaded here -->
                </div>
            </div>

            <!-- Cart Sidebar -->
            <div class="col-md-3">
                <div class="cart-sidebar">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Your Cart</h5>
                            <button class="btn btn-sm btn-outline-danger" onclick="clearCart()">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="cart-items-container">
                                <p class="text-muted text-center py-4">Your cart is empty</p>
                            </div>
                            
                            <hr>
                            
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span id="cart-subtotal" class="fw-bold">Rs. 0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Delivery Fee:</span>
                                <span id="cart-delivery-fee" class="fw-bold">Rs. 0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="fw-bold">Total:</span>
                                <span id="cart-total" class="fw-bold">Rs. 0</span>
                            </div>
                            
                            <button id="go-to-checkout-btn" class="btn foodora-btn-primary w-100" disabled onclick="goToCheckout()">
                                Go to Checkout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Initialize restaurant detail page
        document.addEventListener('DOMContentLoaded', () => {
            loadRestaurantDetails();
        });

        // Clear cart function
        function clearCart() {
            if (confirm('Are you sure you want to clear your cart?')) {
                cart = [];
                saveCart();
                updateCartDisplay();
            }
        }

// Go to checkout function
        function goToCheckout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            
            // Check if user is logged in
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('Please login first to place an order');
                window.location.href = 'auth.html';
                return;
            }
            
            // Store cart data for checkout
            localStorage.setItem('checkoutCart', JSON.stringify(cart));
            localStorage.setItem('checkoutRestaurant', JSON.stringify(currentRestaurant));
            
            // Create order via backend
            createOrder();
        }
        
        // Create order function
        async function createOrder() {
            try {
                const token = localStorage.getItem('authToken');
                const orderData = {
                    restaurant: currentRestaurant._id || currentRestaurant.id,
                    items: cart.map(item => ({
                        menuItem: item.id,
                        quantity: item.quantity,
                        customizations: item.customizations || [],
                        specialInstructions: item.specialInstructions || ''
                    })),
                    deliveryAddress: {
                        street: "Service Road W",
                        city: "Islamabad",
                        state: "ICT",
                        zipCode: "44000"
                    },
                    paymentInfo: {
                        method: "cash"
                    },
                    specialInstructions: "Please call when you arrive"
                };
                
                const response = await fetch(`${API_BASE_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(orderData)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // Clear cart
                    cart = [];
                    saveCart();
                    
                    // Store order data for confirmation page
                    localStorage.setItem('lastOrder', JSON.stringify(data.order));
                    
                    // Redirect to confirmation page
                    window.location.href = 'confirmation.html';
                } else {
                    const errorData = await response.json();
                    alert('Order failed: ' + (errorData.message || 'Please try again'));
                }
            } catch (error) {
                console.error('Order creation error:', error);
                alert('Network error. Please try again.');
            }
        }
    </script>
</body>
</html>
